<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Findly | Sign Up</title>
    
    <!-- Load Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#09090B] text-zinc-50 font-sans antialiased min-h-screen flex flex-col items-center justify-center p-4 relative overflow-x-hidden selection:bg-blue-500/30 selection:text-white">

    <!-- Thematic Grid Background (Nod to mapping/searching) -->
    <div class="fixed inset-0 -z-20 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wMykiLz48L3N2Zz4=')] [mask-image:linear-gradient(to_bottom,white,transparent)] pointer-events-none"></div>

    <!-- Ambient Background Glows -->
    <div class="fixed rounded-full mix-blend-screen pointer-events-none blur-[120px] top-0 left-0 w-[500px] h-[500px] bg-blue-600/10 animate-pulse-slow -z-10"></div>
    <div class="fixed rounded-full mix-blend-screen pointer-events-none blur-[120px] bottom-0 right-0 w-[500px] h-[500px] bg-indigo-600/10 animate-pulse-slow -z-10" style="animation-delay: 2s;"></div>

    <!-- Brand Logo -->
    <a href="{% url 'core:home' %}" class="absolute top-8 left-8 flex items-center gap-2 cursor-pointer z-20 group">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-[0_0_15px_rgba(59,130,246,0.3)] group-hover:scale-105 group-hover:shadow-[0_0_25px_rgba(59,130,246,0.5)] transition-all duration-300">
            <i data-lucide="search" class="w-4 h-4 text-white"></i>
        </div>
        <span class="text-xl font-bold text-white tracking-tight">Findly</span>
    </a>

    <!-- Main Auth Card -->
    <div class="w-full max-w-xl relative z-10 mt-20 mb-10 opacity-0 animate-fade-in-up">
        
        <!-- Glowing card border -->
        <div class="absolute -inset-0.5 bg-gradient-to-br from-blue-500/20 to-indigo-500/20 rounded-2xl blur-md opacity-50"></div>
        
        <div class="relative bg-[#121214]/80 backdrop-blur-xl border border-white/10 rounded-2xl p-6 sm:p-10 shadow-2xl">
            
            <div class="text-center mb-8">
                <h2 class="text-2xl sm:text-3xl font-bold text-white mb-2 tracking-tight">Create an Account</h2>
                <p class="text-zinc-400 text-sm">
                    Join Findly to start recovering and returning lost items.
                </p>
            </div>

            <!-- Django Signup Form -->
            <form method="POST" action="{% url 'core:signup' %}" class="space-y-6">
                {% csrf_token %}

                {% if error %}
                    <div class="bg-red-500/10 border border-red-500/20 text-red-400 px-4 py-3 rounded-lg text-sm flex items-center gap-3 font-medium animate-fade-in-up">
                        <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0"></i>
                        {{ error }}
                    </div>
                {% endif %}

                {% comment %} <!-- VISUAL ROLE SELECTOR (Replaces Dropdown) -->
                <div class="space-y-2 w-full">
                    <label class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">How will you use Findly?</label>
                    <div class="grid grid-cols-3 gap-3">
                        
                        <!-- Finder -->
                        <label class="relative cursor-pointer group">
                            <input type="radio" name="role" value="Finder" required class="peer sr-only">
                            <div class="h-full rounded-xl border border-white/5 bg-zinc-900/30 p-4 flex flex-col items-center justify-center gap-2 hover:bg-white/5 hover:border-white/10 peer-checked:border-blue-500 peer-checked:bg-blue-500/10 peer-checked:shadow-[0_0_15px_rgba(59,130,246,0.15)] transition-all duration-200">
                                <i data-lucide="eye" class="w-6 h-6 text-zinc-500 group-hover:text-zinc-300 peer-checked:text-blue-400 transition-colors"></i>
                                <span class="text-xs font-medium text-zinc-400 peer-checked:text-blue-100">Finder</span>
                            </div>
                            <!-- Active indicator dot -->
                            <div class="absolute top-2 right-2 w-2 h-2 rounded-full bg-blue-500 opacity-0 peer-checked:opacity-100 transition-opacity shadow-[0_0_8px_rgba(59,130,246,0.8)]"></div>
                        </label>

                        <!-- Owner -->
                        <label class="relative cursor-pointer group">
                            <input type="radio" name="role" value="Owner" class="peer sr-only">
                            <div class="h-full rounded-xl border border-white/5 bg-zinc-900/30 p-4 flex flex-col items-center justify-center gap-2 hover:bg-white/5 hover:border-white/10 peer-checked:border-emerald-500 peer-checked:bg-emerald-500/10 peer-checked:shadow-[0_0_15px_rgba(16,185,129,0.15)] transition-all duration-200">
                                <i data-lucide="package" class="w-6 h-6 text-zinc-500 group-hover:text-zinc-300 peer-checked:text-emerald-400 transition-colors"></i>
                                <span class="text-xs font-medium text-zinc-400 peer-checked:text-emerald-100">Owner</span>
                            </div>
                            <div class="absolute top-2 right-2 w-2 h-2 rounded-full bg-emerald-500 opacity-0 peer-checked:opacity-100 transition-opacity shadow-[0_0_8px_rgba(16,185,129,0.8)]"></div>
                        </label>

                        <!-- Admin -->
                        <label class="relative cursor-pointer group">
                            <input type="radio" name="role" value="Admin" class="peer sr-only">
                            <div class="h-full rounded-xl border border-white/5 bg-zinc-900/30 p-4 flex flex-col items-center justify-center gap-2 hover:bg-white/5 hover:border-white/10 peer-checked:border-indigo-500 peer-checked:bg-indigo-500/10 peer-checked:shadow-[0_0_15px_rgba(99,102,241,0.15)] transition-all duration-200">
                                <i data-lucide="shield" class="w-6 h-6 text-zinc-500 group-hover:text-zinc-300 peer-checked:text-indigo-400 transition-colors"></i>
                                <span class="text-xs font-medium text-zinc-400 peer-checked:text-indigo-100">Admin</span>
                            </div>
                            <div class="absolute top-2 right-2 w-2 h-2 rounded-full bg-indigo-500 opacity-0 peer-checked:opacity-100 transition-opacity shadow-[0_0_8px_rgba(99,102,241,0.8)]"></div>
                        </label>
                    </div>
                </div> {% endcomment %}

                <!-- First & Last Name -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div class="space-y-1.5 w-full">
                        <label class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">First Name</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-500 group-focus-within:text-blue-400 transition-colors">
                                <i data-lucide="user" class="h-4 w-4"></i>
                            </div>
                            <input type="text" name="first_name" required placeholder=""
                                class="w-full bg-zinc-900/50 border border-white/10 rounded-xl py-2.5 pl-10 pr-3 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/50 transition-all duration-200 shadow-inner" />
                        </div>
                    </div>
                    <div class="space-y-1.5 w-full">
                        <label class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Last Name</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-500 group-focus-within:text-blue-400 transition-colors">
                                <i data-lucide="user" class="h-4 w-4"></i>
                            </div>
                            <input type="text" name="last_name" required placeholder=""
                                class="w-full bg-zinc-900/50 border border-white/10 rounded-xl py-2.5 pl-10 pr-3 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/50 transition-all duration-200 shadow-inner" />
                        </div>
                    </div>
                </div>

                <!-- SEGMENTED CONTROL FOR GENDER (Replaces Native Radios) -->
                <div class="space-y-1.5 w-full">
                    <label class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Gender</label>
                    <div class="flex p-1 bg-zinc-900/50 border border-white/5 rounded-xl shadow-inner">
                        <label class="flex-1 text-center relative cursor-pointer">
                            <input type="radio" name="gender" value="Male" class="peer sr-only" required>
                            <div class="py-2 text-xs font-medium text-zinc-400 rounded-lg hover:text-zinc-200 peer-checked:bg-[#18181B] peer-checked:text-white peer-checked:shadow-sm transition-all duration-200">Male</div>
                        </label>
                        <label class="flex-1 text-center relative cursor-pointer">
                            <input type="radio" name="gender" value="Female" class="peer sr-only">
                            <div class="py-2 text-xs font-medium text-zinc-400 rounded-lg hover:text-zinc-200 peer-checked:bg-[#18181B] peer-checked:text-white peer-checked:shadow-sm transition-all duration-200">Female</div>
                        </label>
                        <label class="flex-1 text-center relative cursor-pointer">
                            <input type="radio" name="gender" value="Other" class="peer sr-only">
                            <div class="py-2 text-xs font-medium text-zinc-400 rounded-lg hover:text-zinc-200 peer-checked:bg-[#18181B] peer-checked:text-white peer-checked:shadow-sm transition-all duration-200">Other</div>
                        </label>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <!-- Mobile -->
                    <div class="space-y-1.5 w-full">
                        <label class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Mobile</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-500 group-focus-within:text-blue-400 transition-colors">
                                <i data-lucide="phone" class="h-4 w-4"></i>
                            </div>
                            <input type="tel" name="mobile" required placeholder="+1 (555) 000-0000"
                                class="w-full bg-zinc-900/50 border border-white/10 rounded-xl py-2.5 pl-10 pr-3 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/50 transition-all duration-200 shadow-inner" />
                        </div>
                    </div>
                    <!-- Email -->
                    <div class="space-y-1.5 w-full">
                        <label class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Email Address</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-500 group-focus-within:text-blue-400 transition-colors">
                                <i data-lucide="mail" class="h-4 w-4"></i>
                            </div>
                            <input type="email" name="email" required placeholder="name@company.com"
                                class="w-full bg-zinc-900/50 border border-white/10 rounded-xl py-2.5 pl-10 pr-3 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/50 transition-all duration-200 shadow-inner" />
                        </div>
                    </div>
                </div>

                <!-- Password -->
                <div class="space-y-1.5 w-full">
                    <label class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Password</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-500 group-focus-within:text-blue-400 transition-colors">
                            <i data-lucide="lock" class="h-4 w-4"></i>
                        </div>
                        <input type="password" name="password1" id="password" required placeholder="Create a secure password"
                            class="w-full bg-zinc-900/50 border border-white/10 rounded-xl py-2.5 pl-10 pr-3 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/50 transition-all duration-200 shadow-inner" />
                    </div>
                </div>

                <!-- DYNAMIC PASSWORD RULES (Reacts to typing via JS) -->
                <div class="bg-zinc-950/50 border border-white/5 rounded-xl p-4 mt-2">
                    <ul class="space-y-2 text-[11px] font-medium text-zinc-500" id="password-rules">
                        <li class="flex items-center gap-2 transition-colors duration-300" id="rule-length">
                            <i data-lucide="circle" class="w-3 h-3 rule-icon"></i> At least 8 characters
                        </li>
                        <li class="flex items-center gap-2 transition-colors duration-300" id="rule-number">
                            <i data-lucide="circle" class="w-3 h-3 rule-icon"></i> Contains a number
                        </li>
                        <li class="flex items-center gap-2 transition-colors duration-300" id="rule-special">
                            <i data-lucide="circle" class="w-3 h-3 rule-icon"></i> Contains a special character
                        </li>
                    </ul>
                </div>

                <!-- Password Confirmation -->
                <div class="space-y-1.5 w-full">
                    <label class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Confirm Password</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-500 group-focus-within:text-blue-400 transition-colors">
                            <i data-lucide="shield-check" class="h-4 w-4"></i>
                        </div>
                        <input type="password" name="password2" id="password_confirmation" required placeholder="Confirm your password"
                            class="w-full bg-zinc-900/50 border border-white/10 rounded-xl py-2.5 pl-10 pr-3 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/50 transition-all duration-200 shadow-inner" />
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="group relative w-full inline-flex items-center justify-center gap-2 overflow-hidden rounded-xl px-4 py-3.5 text-sm font-semibold transition-all duration-300 ease-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-zinc-950 bg-blue-600 text-white hover:bg-blue-500 focus:ring-blue-500 shadow-[0_0_20px_rgba(37,99,235,0.25)] hover:shadow-[0_0_35px_rgba(37,99,235,0.5)] border border-blue-500/50 mt-8">
                    <div class="absolute inset-0 top-0 h-[1px] w-full bg-gradient-to-r from-transparent via-white/30 to-transparent opacity-50"></div>
                    <span>Create Account</span>
                    <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                </button>
            </form>

            <div class="mt-8 text-center text-sm text-zinc-400">
                Already have an account? 
                <a href="{% url 'core:login' %}" class="text-white font-semibold hover:text-blue-400 underline decoration-white/30 hover:decoration-blue-400 underline-offset-4 transition-all">Log in here</a>
            </div>

        </div>
    </div>

    <!-- Initialize Icons & Micro-interactions -->
    <script>
        // 1. Render Icons
        lucide.createIcons();

        // 2. Real-time Password Strength Micro-interaction
        const passwordInput = document.getElementById('password');
        const ruleLength = document.getElementById('rule-length');
        const ruleNumber = document.getElementById('rule-number');
        const ruleSpecial = document.getElementById('rule-special');

        passwordInput.addEventListener('input', function() {
            const val = this.value;
            
            // Helper function to toggle classes and icons
            const toggleRule = (element, isValid) => {
                const icon = element.querySelector('.rule-icon');
                if (isValid) {
                    element.classList.remove('text-zinc-500');
                    element.classList.add('text-emerald-400');
                    // Change icon to check
                    icon.setAttribute('data-lucide', 'check-circle-2');
                } else {
                    element.classList.remove('text-emerald-400');
                    element.classList.add('text-zinc-500');
                    // Change back to circle
                    icon.setAttribute('data-lucide', 'circle');
                }
                // Re-render specifically updated icons
                lucide.createIcons({ root: element });
            };

            // Check rules
            toggleRule(ruleLength, val.length >= 8);
            toggleRule(ruleNumber, /\d/.test(val));
            toggleRule(ruleSpecial, /[!@#$%^&*(),.?":{}|<>]/.test(val));
        });
    </script>
</body>
</html>
