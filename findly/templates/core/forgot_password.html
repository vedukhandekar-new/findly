<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Findly | Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#09090B] text-zinc-50 font-sans antialiased min-h-screen flex items-center justify-center px-4">
<div class="w-full max-w-md">

    <div class="text-center mb-8">
        <a href="{% url 'core:home' %}" class="inline-flex items-center gap-2 mb-6">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-[0_0_20px_rgba(59,130,246,0.3)]">
                <i data-lucide="search" class="w-5 h-5 text-white"></i>
            </div>
            <span class="text-2xl font-extrabold tracking-tight">Findly</span>
        </a>
        <div class="w-16 h-16 rounded-2xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center mx-auto mb-4">
            <i data-lucide="key-round" class="w-8 h-8 text-blue-400"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-zinc-100">Forgot Password?</h1>
        <p class="text-zinc-400 text-sm mt-2">Enter your email and we'll send you an OTP to reset your password.</p>
    </div>

    {% if messages %}
        {% for msg in messages %}
            <div class="mb-4 px-4 py-3 rounded-xl border text-sm
                {% if msg.tags == 'success' %}bg-emerald-500/10 border-emerald-500/20 text-emerald-400
                {% else %}bg-red-500/10 border-red-500/20 text-red-400{% endif %}">
                {{ msg }}
            </div>
        {% endfor %}
    {% endif %}

    <div class="bg-[#121214] border border-white/10 rounded-2xl p-6 shadow-2xl">
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1.5">Email Address</label>
                <input type="email" name="email" required placeholder="you@example.com"
                    class="w-full px-4 py-3 rounded-xl bg-zinc-900 border border-white/10 text-zinc-100 text-sm placeholder-zinc-600 focus:outline-none focus:border-blue-500/50 focus:ring-2 focus:ring-blue-500/10 transition-all"/>
            </div>
            <button type="submit"
                class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm transition-all shadow-[0_0_15px_rgba(37,99,235,0.2)] border border-blue-500/50 flex items-center justify-center gap-2">
                <i data-lucide="send" class="w-4 h-4"></i> Send OTP
            </button>
        </form>
    </div>

    <p class="text-center text-sm text-zinc-600 mt-6">
        Remember your password?
        <a href="{% url 'core:login' %}" class="text-blue-400 hover:text-blue-300 font-medium transition-colors">Log in →</a>
    </p>
</div>
<script>
    document.addEventListener("DOMContentLoaded", () => { if (typeof lucide !== 'undefined') lucide.createIcons(); });
</script>
</body>
</html>
