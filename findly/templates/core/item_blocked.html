<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Findly | Item Restricted</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#09090B] text-zinc-50 font-sans antialiased min-h-screen flex items-center justify-center px-4">
<div class="text-center max-w-md mx-auto">
    <div class="w-20 h-20 rounded-2xl bg-red-500/10 border border-red-500/20 flex items-center justify-center mx-auto mb-6">
        <i data-lucide="shield-x" class="w-10 h-10 text-red-400"></i>
    </div>
    <h1 class="text-2xl font-extrabold text-zinc-100 mb-3">Item Restricted</h1>
    <p class="text-zinc-400 text-sm mb-2">This item has been restricted by our admin team.</p>
    <p class="text-zinc-600 text-xs mb-8">If you believe this is a mistake, please contact support.</p>
    <a href="/" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm transition-all border border-blue-500/50">
        <i data-lucide="home" class="w-4 h-4"></i> Go Home
    </a>
</div>
<script>
    document.addEventListener("DOMContentLoaded", () => { if (typeof lucide !== 'undefined') lucide.createIcons(); });
</script>
</body>
</html>
