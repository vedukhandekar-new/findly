<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Findly | Verify Email</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: { zinc: { 50:'#FAFAFA',100:'#F4F4F5',200:'#E4E4E7',300:'#D4D4D8',400:'#A1A1AA',500:'#71717A',600:'#52525B',700:'#3F3F46',800:'#27272A',900:'#18181B',950:'#09090B' } } } }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#09090B] text-zinc-50 font-sans antialiased min-h-screen flex items-center justify-center px-4">

<div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-8">
        <a href="{% url 'core:home' %}" class="inline-flex items-center gap-2 mb-6">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-[0_0_20px_rgba(59,130,246,0.3)]">
                <i data-lucide="search" class="w-5 h-5 text-white"></i>
            </div>
            <span class="text-2xl font-extrabold tracking-tight">Findly</span>
        </a>

        <!-- Icon -->
        <div class="w-16 h-16 rounded-2xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center mx-auto mb-4">
            <i data-lucide="mail" class="w-8 h-8 text-blue-400"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-zinc-100">Verify your email</h1>
        <p class="text-zinc-400 text-sm mt-2">
            We sent a 6-digit OTP to<br/>
            <span class="text-zinc-200 font-semibold">{{ email }}</span>
        </p>
    </div>

    <!-- Flash Messages -->
    {% if messages %}
        {% for msg in messages %}
            <div class="mb-4 px-4 py-3 rounded-xl border text-sm
                {% if msg.tags == 'success' %}bg-emerald-500/10 border-emerald-500/20 text-emerald-400
                {% else %}bg-red-500/10 border-red-500/20 text-red-400{% endif %}">
                {{ msg }}
            </div>
        {% endfor %}
    {% endif %}

    <!-- OTP Form -->
    <div class="bg-[#121214] border border-white/10 rounded-2xl p-6 shadow-2xl">
        <form method="POST">
            {% csrf_token %}
            <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-3">
                Enter OTP
            </label>

            <!-- OTP Input Boxes -->
            <div class="flex gap-2 justify-center mb-6" id="otp-boxes">
                <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-zinc-900 border border-white/10 rounded-xl text-zinc-100 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none transition-all" />
                <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-zinc-900 border border-white/10 rounded-xl text-zinc-100 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none transition-all" />
                <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-zinc-900 border border-white/10 rounded-xl text-zinc-100 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none transition-all" />
                <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-zinc-900 border border-white/10 rounded-xl text-zinc-100 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none transition-all" />
                <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-zinc-900 border border-white/10 rounded-xl text-zinc-100 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none transition-all" />
                <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-zinc-900 border border-white/10 rounded-xl text-zinc-100 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none transition-all" />
            </div>

            <!-- Hidden combined OTP input -->
            <input type="hidden" name="otp" id="otp-combined"/>

            <button type="submit"
                class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm transition-all shadow-[0_0_20px_rgba(37,99,235,0.3)] border border-blue-500/50 flex items-center justify-center gap-2">
                <i data-lucide="check-circle" class="w-4 h-4"></i> Verify Email
            </button>
        </form>

        <!-- Resend OTP -->
        <div class="mt-4 text-center">
            <p class="text-zinc-500 text-sm">Didn't receive the code?</p>
            <a href="{% url 'core:resend_otp' %}"
                class="text-blue-400 hover:text-blue-300 text-sm font-medium transition-colors mt-1 inline-block">
                Resend OTP →
            </a>
        </div>
    </div>

    <p class="text-center text-sm text-zinc-600 mt-6">
        Wrong email?
        <a href="{% url 'core:signup' %}" class="text-blue-400 hover:text-blue-300 font-medium transition-colors">Sign up again →</a>
    </p>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        if (typeof lucide !== 'undefined') lucide.createIcons();

        const inputs = document.querySelectorAll('.otp-input');
        const combined = document.getElementById('otp-combined');

        // Auto focus next box
        inputs.forEach((input, i) => {
            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
                if (this.value && i < inputs.length - 1) {
                    inputs[i + 1].focus();
                }
                updateCombined();
            });
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !this.value && i > 0) {
                    inputs[i - 1].focus();
                }
            });
            // Handle paste
            input.addEventListener('paste', function(e) {
                e.preventDefault();
                const pasted = e.clipboardData.getData('text').replace(/[^0-9]/g, '');
                pasted.split('').forEach((char, j) => {
                    if (inputs[i + j]) inputs[i + j].value = char;
                });
                updateCombined();
                const nextEmpty = [...inputs].findIndex(inp => !inp.value);
                if (nextEmpty !== -1) inputs[nextEmpty].focus();
            });
        });

        function updateCombined() {
            combined.value = [...inputs].map(inp => inp.value).join('');
        }

        // Focus first input on load
        inputs[0].focus();
    });
</script>
</body>
</html>
