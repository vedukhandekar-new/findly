<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Findly | Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#09090B] text-zinc-50 font-sans antialiased min-h-screen flex items-center justify-center px-4">
<div class="w-full max-w-md">

    <div class="text-center mb-8">
        <a href="{% url 'core:home' %}" class="inline-flex items-center gap-2 mb-6">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-[0_0_20px_rgba(59,130,246,0.3)]">
                <i data-lucide="search" class="w-5 h-5 text-white"></i>
            </div>
            <span class="text-2xl font-extrabold tracking-tight">Findly</span>
        </a>
        <div class="w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center mx-auto mb-4">
            <i data-lucide="lock-keyhole" class="w-8 h-8 text-emerald-400"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-zinc-100">Set New Password</h1>
        <p class="text-zinc-400 text-sm mt-2">Choose a strong password for<br/>
            <span class="text-zinc-200 font-semibold">{{ email }}</span>
        </p>
    </div>

    {% if messages %}
        {% for msg in messages %}
            <div class="mb-4 px-4 py-3 rounded-xl border text-sm
                {% if msg.tags == 'success' %}bg-emerald-500/10 border-emerald-500/20 text-emerald-400
                {% else %}bg-red-500/10 border-red-500/20 text-red-400{% endif %}">
                {{ msg }}
            </div>
        {% endfor %}
    {% endif %}

    <div class="bg-[#121214] border border-white/10 rounded-2xl p-6 shadow-2xl">
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1.5">New Password</label>
                <input type="password" name="password1" required placeholder="Min 8 characters"
                    class="w-full px-4 py-3 rounded-xl bg-zinc-900 border border-white/10 text-zinc-100 text-sm placeholder-zinc-600 focus:outline-none focus:border-emerald-500/50 focus:ring-2 focus:ring-emerald-500/10 transition-all"/>
            </div>
            <div>
                <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1.5">Confirm Password</label>
                <input type="password" name="password2" required placeholder="Repeat password"
                    class="w-full px-4 py-3 rounded-xl bg-zinc-900 border border-white/10 text-zinc-100 text-sm placeholder-zinc-600 focus:outline-none focus:border-emerald-500/50 focus:ring-2 focus:ring-emerald-500/10 transition-all"/>
            </div>

            <!-- Password strength -->
            <div id="strength-bar" class="h-1 rounded-full bg-zinc-800 overflow-hidden">
                <div id="strength-fill" class="h-full rounded-full transition-all duration-300 w-0"></div>
            </div>
            <p id="strength-text" class="text-xs text-zinc-600"></p>

            <button type="submit"
                class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm transition-all shadow-[0_0_15px_rgba(16,185,129,0.2)] border border-emerald-500/50 flex items-center justify-center gap-2">
                <i data-lucide="check-circle" class="w-4 h-4"></i> Reset Password
            </button>
        </form>
    </div>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        if (typeof lucide !== 'undefined') lucide.createIcons();
        const input = document.querySelector('input[name="password1"]');
        const fill  = document.getElementById('strength-fill');
        const text  = document.getElementById('strength-text');
        input.addEventListener('input', function() {
            const val = this.value;
            let score = 0;
            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;
            const levels = [
                { w: '0%',    color: '',               label: '' },
                { w: '25%',   color: 'bg-red-500',     label: 'Weak' },
                { w: '50%',   color: 'bg-amber-500',   label: 'Fair' },
                { w: '75%',   color: 'bg-blue-500',    label: 'Good' },
                { w: '100%',  color: 'bg-emerald-500', label: 'Strong' },
            ];
            fill.className = `h-full rounded-full transition-all duration-300 ${levels[score].color}`;
            fill.style.width = levels[score].w;
            text.textContent = levels[score].label;
        });
    });
</script>
</body>
</html>
