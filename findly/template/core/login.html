<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Findly | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: { zinc: { 50:'#FAFAFA',100:'#F4F4F5',200:'#E4E4E7',300:'#D4D4D8',400:'#A1A1AA',500:'#71717A',600:'#52525B',700:'#3F3F46',800:'#27272A',900:'#18181B',950:'#09090B' } } } }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#09090B] text-zinc-50 font-sans antialiased min-h-screen flex items-center justify-center px-4">

<!-- Ambient glows -->
<div class="fixed top-0 left-1/4 w-[500px] h-[500px] bg-blue-500/5 rounded-full blur-[120px] pointer-events-none"></div>
<div class="fixed bottom-0 right-1/4 w-[500px] h-[500px] bg-indigo-500/5 rounded-full blur-[120px] pointer-events-none"></div>

<div class="w-full max-w-md relative z-10">

    <!-- Logo -->
    <div class="text-center mb-8">
        <a href="{% url 'core:home' %}" class="inline-flex items-center gap-2 mb-6">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-[0_0_20px_rgba(59,130,246,0.3)]">
                <i data-lucide="search" class="w-5 h-5 text-white"></i>
            </div>
            <span class="text-2xl font-extrabold tracking-tight">Findly</span>
        </a>
        <h1 class="text-2xl font-extrabold text-zinc-100">Welcome back</h1>
        <p class="text-zinc-400 text-sm mt-2">Log in to manage your lost and found items</p>
    </div>

    <!-- Error Message -->
    {% if error %}
        <div class="mb-4 px-4 py-3 rounded-xl border bg-red-500/10 border-red-500/20 text-red-400 text-sm">
            {{ error }}
        </div>
    {% endif %}

    <!-- Flash Messages -->
    {% if messages %}
        {% for msg in messages %}
            <div class="mb-4 px-4 py-3 rounded-xl border text-sm
                {% if msg.tags == 'success' %}bg-emerald-500/10 border-emerald-500/20 text-emerald-400
                {% else %}bg-red-500/10 border-red-500/20 text-red-400{% endif %}">
                {{ msg }}
            </div>
        {% endfor %}
    {% endif %}

    <!-- Login Card -->
    <div class="bg-[#121214] border border-white/10 rounded-2xl p-6 shadow-2xl">
        <form method="POST" class="space-y-4">
            {% csrf_token %}

            <!-- Email -->
            <div>
                <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1.5">
                    Email Address
                </label>
                <div class="relative">
                    <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-600"></i>
                    <input type="email" name="email" required placeholder="you@example.com"
                        class="w-full pl-10 pr-4 py-3 rounded-xl bg-zinc-900 border border-white/10 text-zinc-100 text-sm placeholder-zinc-600 focus:outline-none focus:border-blue-500/50 focus:ring-2 focus:ring-blue-500/10 transition-all"/>
                </div>
            </div>

            <!-- Password -->
            <div>
                <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1.5">
                    Password
                </label>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-600"></i>
                    <input type="password" name="password" id="password" required placeholder="••••••••"
                        class="w-full pl-10 pr-10 py-3 rounded-xl bg-zinc-900 border border-white/10 text-zinc-100 text-sm placeholder-zinc-600 focus:outline-none focus:border-blue-500/50 focus:ring-2 focus:ring-blue-500/10 transition-all"/>
                    <button type="button" onclick="togglePassword()"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-600 hover:text-zinc-400 transition-colors">
                        <i data-lucide="eye" class="w-4 h-4" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <!-- Forgot Password -->
            <div class="flex justify-end">
                <a href="{% url 'core:forgot_password' %}"
                    class="text-xs text-zinc-500 hover:text-blue-400 transition-colors">
                    Forgot your password?
                </a>
            </div>

            <!-- Submit -->
            <button type="submit"
                class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm transition-all shadow-[0_0_15px_rgba(37,99,235,0.2)] border border-blue-500/50 flex items-center justify-center gap-2">
                <i data-lucide="log-in" class="w-4 h-4"></i> Log In
            </button>
        </form>
    </div>

    <!-- Divider -->
    <div class="flex items-center gap-3 my-6">
        <div class="flex-1 h-px bg-white/5"></div>
        <span class="text-xs text-zinc-600">or</span>
        <div class="flex-1 h-px bg-white/5"></div>
    </div>

    <!-- Register Link -->
    <div class="bg-[#121214] border border-white/10 rounded-2xl p-4 text-center">
        <p class="text-zinc-500 text-sm">
            Don't have an account?
            <a href="{% url 'core:signup' %}" class="text-blue-400 hover:text-blue-300 font-semibold transition-colors ml-1">
                Sign up for free →
            </a>
        </p>
    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        if (typeof lucide !== 'undefined') lucide.createIcons();
    });

    function togglePassword() {
        const input   = document.getElementById('password');
        const icon    = document.getElementById('eye-icon');
        const showing = input.type === 'text';
        input.type    = showing ? 'password' : 'text';
        icon.setAttribute('data-lucide', showing ? 'eye' : 'eye-off');
        if (typeof lucide !== 'undefined') lucide.createIcons();
    }
</script>
</body>
</html>
